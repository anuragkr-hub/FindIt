<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title, content, extraStyles, extraScripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FindIt - Campus and Public Space Lost and Found Platform">
    <title th:replace="${title}">FindIt | Campus Lost & Found</title>

    <link rel="icon" type="image/png" th:href="@{/img/logo.png}">

    <!-- Stylesheets with Cache Busting -->
    <link rel="stylesheet" th:href="@{/css/main.css(v='5.1')}">
    <link rel="stylesheet" th:href="@{/css/components.css(v='5.1')}">
    <link rel="stylesheet" th:href="@{/css/dashboard-premium.css(v='5.1')}">
    <link rel="stylesheet" th:href="@{/css/responsive.css(v='5.1')}">

    <!-- Optional Page-specific CSS -->
    <th:block th:replace="${extraStyles} ?: ~{}"></th:block>
</head>
<body>
    <a href="#main-content" class="skip-to-content">Skip to main content</a>

    <!-- Header Navigation -->
    <div th:replace="~{layout/header :: header}"></div>

    <!-- Main Content Area -->
    <main id="main-content" style="padding-top: 1.5rem; padding-bottom: 3.5rem;">
        <div class="container">
            <!-- Global Flash Alerts -->
            <div th:replace="~{layout/alerts :: alerts}"></div>

            <!-- Page Content Insertion -->
            <div th:replace="${content}">
                <p>Default page content goes here.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{layout/footer :: footer}"></div>

    <!-- Core Scripts with Cache Busting -->
    <script th:src="@{/js/app.js(v='5.1')}"></script>
    <script th:src="@{/js/otp.js(v='5.1')}"></script>

    <!-- Optional Page-specific JS -->
    <th:block th:replace="${extraScripts} ?: ~{}"></th:block>
</body>
</html>
