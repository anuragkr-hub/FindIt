<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, ~{})}">
<head>
    <title th:text="${(errorCode != null ? errorCode : '500') + ' | FindIt'}">Error | FindIt</title>
</head>
<body>
<div th:fragment="content">
    <div style="max-width: 600px; margin: 3rem auto; text-align: center;">
        <div style="font-size: 5rem; font-weight: 900; line-height: 1; color: var(--color-blue-600); margin-bottom: 1rem;"
             th:text="${errorCode != null ? errorCode : '500'}">500</div>

        <h1 style="font-size: 1.85rem; margin-bottom: 0.75rem;" th:text="${errorTitle != null ? errorTitle : 'Unexpected Error'}">Something Went Wrong</h1>

        <p style="color: var(--color-slate-600); font-size: 1.05rem; margin-bottom: 2rem;"
           th:text="${errorMessage != null ? errorMessage : 'The requested resource was not found or an error occurred while processing.'}">
            The page you requested could not be found or you do not have permission to access it.
        </p>

        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/}" class="btn btn-primary">Return Home</a>
            <a th:href="@{/items}" class="btn btn-outline-navy">Browse Items</a>
        </div>
    </div>
</div>
</body>
</html>
