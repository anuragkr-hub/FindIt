<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, ~{})}">
<head>
    <title>Notifications | FindIt</title>
</head>
<body>
<div th:fragment="content">
    <div style="max-width: 820px; margin: 0 auto;">
        <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
            <div>
                <h1>Notifications</h1>
                <p class="text-muted" style="margin-bottom: 0;">Stay informed about match suggestions, claim updates, and activity.</p>
            </div>

            <form th:if="${unreadNotificationCount > 0}" th:action="@{/notifications/read-all}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-sm btn-outline-navy">
                    Mark All as Read
                </button>
            </form>
        </div>

        <div class="card">
            <div class="card-body" style="padding: 0;">
                <div th:if="${notificationPage != null && notificationPage.hasContent()}">
                    <div th:each="n : ${notificationPage.content}"
                         th:style="'padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--color-slate-100); display: flex; align-items: flex-start; gap: 1rem; transition: background 0.15s;' + (${!n.read} ? 'background-color: var(--color-blue-50);' : '')">

                        <!-- Type Icon -->
                        <div style="width: 40px; height: 40px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"
                             th:class="${n.type.name() == 'MATCH_FOUND' ? 'stat-icon-blue' : (n.type.name() == 'CLAIM_RECEIVED' ? 'stat-icon-amber' : (n.type.name() == 'CLAIM_APPROVED' ? 'stat-icon-green' : 'stat-icon-navy'))}">
                            <svg th:if="${n.type.name() == 'MATCH_FOUND'}" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            <svg th:if="${n.type.name() == 'CLAIM_RECEIVED'}" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            <svg th:if="${n.type.name() == 'CLAIM_APPROVED'}" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <svg th:if="${n.type.name() == 'CLAIM_REJECTED' || n.type.name() == 'SYSTEM'}" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        </div>

                        <!-- Content -->
                        <div style="flex: 1;">
                            <div class="d-flex align-items-center justify-content-between mb-1">
                                <strong th:text="${n.title}" style="color: var(--color-navy-900); font-size: 0.95rem;">Notification Title</strong>
                                <span style="font-size: 0.75rem; color: var(--color-slate-400);" th:text="${#temporals.format(n.createdAt, 'MMM dd, yyyy HH:mm')}">Date</span>
                            </div>

                            <p style="font-size: 0.9rem; color: var(--color-slate-600); margin-bottom: 0.5rem;" th:text="${n.message}">
                                Message body...
                            </p>

                            <div class="d-flex align-items-center gap-3">
                                <a th:if="${n.linkUrl != null}" th:href="@{${n.linkUrl}}" class="btn btn-sm btn-primary">
                                    View Details &rarr;
                                </a>

                                <form th:if="${!n.read}" th:action="@{'/notifications/' + ${n.id} + '/read'}" method="post" style="display: inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-sm btn-outline-navy" style="font-size: 0.75rem; padding: 0.2rem 0.5rem;">
                                        Mark as Read
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:unless="${notificationPage != null && notificationPage.hasContent()}" class="empty-state" style="border: none;">
                    <svg class="empty-state-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    <h3 class="empty-state-title">No notifications right now</h3>
                    <p class="empty-state-text">You're completely caught up! We'll alert you whenever potential matches or claim updates occur.</p>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${notificationPage != null && notificationPage.totalPages > 1}" class="mt-4" aria-label="Notification pagination">
            <ul class="pagination">
                <li th:class="'page-item ' + (${notificationPage.first} ? 'disabled' : '')">
                    <a class="page-link" th:href="@{/notifications(page=${notificationPage.number - 1})}">&laquo; Prev</a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, notificationPage.totalPages - 1)}"
                    th:class="'page-item ' + (${i == notificationPage.number} ? 'active' : '')">
                    <a class="page-link" th:href="@{/notifications(page=${i})}" th:text="${i + 1}">1</a>
                </li>
                <li th:class="'page-item ' + (${notificationPage.last} ? 'disabled' : '')">
                    <a class="page-link" th:href="@{/notifications(page=${notificationPage.number + 1})}">Next &raquo;</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</body>
</html>
